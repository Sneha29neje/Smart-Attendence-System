{% extends "base.html" %}
{% block title %}{{ 'Edit Student' if mode == 'edit' else 'Add Student' }}{% endblock %}
{% block content %}
<div class="form-card"><h1>{{ 'Edit Student' if mode == 'edit' else 'Add Student' }}</h1>
<form method="post">
<label>Roll Number *</label><input type="text" name="roll_no" required value="{{ student.roll_no if student else '' }}">
<label>Name *</label><input type="text" name="name" required value="{{ student.name if student else '' }}">
<label>Email</label><input type="email" name="email" value="{{ student.email if student else '' }}">
<label>Department</label><input type="text" name="department" value="{{ student.department if student else '' }}">
<label>Semester</label><input type="text" name="semester" value="{{ student.semester if student else '' }}">
<div class="form-actions"><button class="button" type="submit">Save Student</button><a class="button secondary" href="{{ url_for('students_list') }}">Cancel</a></div>
</form></div>
{% endblock %}
